<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluestock Nifty 100</title>
    <!-- Load Tailwind CSS and Chart.js -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased flex flex-col min-h-screen">
    
    <!-- Top Navigation Bar -->
    <nav class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="text-2xl font-bold tracking-tight text-blue-400">Bluestock</div>
                <div class="space-x-6 text-sm font-medium">
                    <a href="/" class="hover:text-blue-400 transition">Home</a>
                    <a href="/companies/" class="hover:text-blue-400 transition">Companies</a>
                    <a href="/compare/" class="hover:text-blue-400 transition">Compare</a>
                    <a href="/screener/" class="hover:text-blue-400 transition">Screener</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Page Specific Content Injected Here -->
    <main class="flex-grow">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 py-6 text-center text-sm mt-12">
        <p>&copy; 2026 Bluestock Financial Intelligence Platform</p>
    </footer>
</body>
</html>

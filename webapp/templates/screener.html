{% extends 'base.html' %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex flex-col md:flex-row gap-8">
    
    <!-- Left Sidebar: Filters (PRD Requirements) -->
    <div class="w-full md:w-1/4 bg-white p-6 rounded-lg shadow-sm border border-slate-200 h-fit">
        <h2 class="text-xl font-bold text-slate-900 mb-6 border-b pb-2">Filters</h2>
        
        <form id="screenerForm" class="space-y-5">
            <!-- Sector Filter -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Sector</label>
                <select name="sector" class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                    <option value="">All Sectors</option>
                    {% for sector in sectors %}
                    <option value="{{ sector }}">{{ sector }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Health Label Filter -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Health Label</label>
                <select name="health_label" class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                    <option value="">Any Label</option>
                    <option value="EXCELLENT">Excellent</option>
                    <option value="GOOD">Good</option>
                    <option value="AVERAGE">Average</option>
                    <option value="WEAK">Weak</option>
                    <option value="POOR">Poor</option>
                </select>
            </div>

            <!-- Min ROE -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Min ROE (%)</label>
                <input type="number" name="min_roe" placeholder="e.g. 15" class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>

            <!-- Max D/E Ratio -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Max Debt-to-Equity</label>
                <input type="number" step="0.1" name="max_de" placeholder="e.g. 1.0" class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>

            <button type="button" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition">
                Apply Filters
            </button>
        </form>
    </div>

    <!-- Right Side: Results Table -->
    <div class="w-full md:w-3/4">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-2xl font-bold text-slate-900">Screener Results</h2>
            <span class="text-sm font-medium text-slate-500">Showing all matching companies</span>
        </div>

        <div class="bg-white shadow-md rounded-lg overflow-x-auto border border-slate-200">
            <table class="min-w-full divide-y divide-slate-200">
                <thead class="bg-slate-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase">Symbol</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase">Company Name</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase">Sector</th>
                        <th class="px-6 py-3 text-right text-xs font-semibold text-slate-500 uppercase">Action</th>
                    </tr>
                </thead>
                <tbody id="screenerResults" class="bg-white divide-y divide-slate-200">
                    <!-- Results will be populated here via AJAX. Placeholder for visual structure: -->
                    <tr class="hover:bg-slate-50 transition">
                        <td colspan="4" class="px-6 py-10 text-center text-slate-500">
                            Configure filters and click "Apply Filters" to query the database.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
{% endblock %}
